[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ci-failure-triage"
version = "0.1.0"
description = "Rules-based CI failure triage for logs, reports, and automation."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ci-failure-triage contributors" }]
keywords = ["ci", "pytest", "failure", "triage", "devops"]
dependencies = ["typer>=0.12"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/770380643/ci-failure-triage"
Issues = "https://github.com/770380643/ci-failure-triage/issues"

[project.scripts]
ci-triage = "ci_failure_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_failure_triage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
